<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52">
  <!-- Vertical accent bar -->
  <rect x="0" y="4" width="3" height="44" fill="#1c3557"/>
  <!-- FT monogram circle -->
  <circle cx="20" cy="26" r="16" fill="none" stroke="#1c3557" stroke-width="1.5"/>
  <text x="20" y="31" font-family="Georgia,serif" font-weight="700" font-size="14" fill="#1c3557" text-anchor="middle">FT</text>
  <!-- Main name -->
  <text x="44" y="23" font-family="Georgia,serif" font-weight="700" font-size="16" fill="#1c3557">Frank Taylor</text>
  <!-- Ampersand + associates -->
  <text x="44" y="38" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#4a6d96" letter-spacing="1.5">&amp; ASSOCIATES</text>
  <!-- Thin underline -->
  <line x1="44" y1="44" x2="255" y2="44" stroke="#c4187a" stroke-width="1.5"/>
</svg>
